<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马来西亚特产订购</title>
    <!-- 连接到你的 CSS 文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <!-- 换成你自己的真实图片链接 -->
        <img src="https://via.placeholder.com/300x200?text=Durian+Coffee" alt="榴莲白咖啡">
        <div class="product-info">
            <h2>顶级榴莲白咖啡</h2>
            <p>纯正马来西亚风味，浓郁香滑。</p>
            <div class="price">RM 1.00</div>
            <!-- 结账按钮 -->
            <button id="checkout-btn">立即购买 (支持信用卡/FPX)</button>
        </div>
    </div>

    <!-- 连接到你的 JS 文件，必须放在 body 结束标签前 -->
    <script src="script.js"></script>
</body>
</html>
